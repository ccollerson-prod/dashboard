name: Update Dashboard Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests icalendar recurring-ical-events

      - name: Fetch Private Calendar, iCloud Photos & Build PWA Assets
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          ICLOUD_ALBUM_TOKEN: ${{ secrets.ICLOUD_ALBUM_TOKEN }}
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp manifest.json public/manifest.json
          cp sw.js public/sw.js
          python - << 'EOF'
          import os, json, zlib, struct, requests
          from datetime import datetime, timedelta, timezone
          from icalendar import Calendar
          import recurring_ical_events

          # 0. Generate valid 512x512 and 192x192 PNG icons
          def make_png(path, w=512, h=512):
              bg = b'\x0f\x17\x2a\xff'
              fg = b'\x38\xbd\xf8\xff'
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  in_border = (48 <= y < 72) or (h - 72 <= y < h - 48)
                  in_vert = (48 <= y < h - 48)
                  for x in range(w):
                      if (in_border and 48 <= x < w - 48) or (in_vert and ((48 <= x < 72) or (w - 72 <= x < w - 48))):
                          raw.extend(fg)
                      elif (180 <= y < 332) and (180 <= x < 332):
                          raw.extend(fg)
                      else:
                          raw.extend(bg)
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              with open(path, "wb") as f:
                  f.write(png)

          make_png("public/icon-512.png", 512, 512)
          make_png("public/icon-192.png", 192, 192)

          # 1. Fetch & expand recurring events for the next 14 days
          ical_url = os.environ.get("ICAL_URL", "").strip()
          events_out = []
          if ical_url:
              r = requests.get(ical_url, timeout=30)
              r.raise_for_status()
              cal = Calendar.from_ical(r.text)
              now = datetime.now(timezone.utc)
              start = now - timedelta(days=1)
              end = now + timedelta(days=14)
              expanded = recurring_ical_events.of(cal).between(start, end)
              for component in expanded:
                  summary = str(component.get("SUMMARY", "Busy"))
                  dtstart = component.get("DTSTART").dt
                  if hasattr(dtstart, "isoformat"):
                      if hasattr(dtstart, "tzinfo") and dtstart.tzinfo is not None:
                          dt_utc = dtstart.astimezone(timezone.utc)
                          start_str = dt_utc.strftime("%Y%m%dT%H%M%SZ")
                      elif isinstance(dtstart, datetime):
                          start_str = dtstart.strftime("%Y%m%dT%H%M%S")
                      else:
                          start_str = dtstart.strftime("%Y%m%d")
                  else:
                      start_str = str(dtstart)
                  events_out.append({"title": summary, "start": start_str})

          with open("public/events.json", "w") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "events": events_out}, f)
          print(f"Saved {len(events_out)} calendar events.")

          # 2. Fetch up to 200 image URLs from a public Apple iCloud Shared Album
          token = os.environ.get("ICLOUD_ALBUM_TOKEN", "").strip()
          photos = []
          if token:
              base_url = f"https://p23-sharedstreams.icloud.com/{token}/sharedstreams"
              headers = {"Content-Type": "application/json"}
              stream_resp = requests.post(f"{base_url}/webstream", json={"streamCtag": None}, headers=headers, timeout=30)
              if stream_resp.status_code == 330 and stream_resp.json().get("X-Apple-MMe-Host"):
                  host = stream_resp.json()["X-Apple-MMe-Host"]
                  base_url = f"https://{host}/{token}/sharedstreams"
                  stream_resp = requests.post(f"{base_url}/webstream", json={"streamCtag": None}, headers=headers, timeout=30)
              stream_resp.raise_for_status()
              stream_data = stream_resp.json()
              photo_guids = [p.get("photoGuid") for p in stream_data.get("photos", []) if p.get("photoGuid")][:200]

              if photo_guids:
                  assets_resp = requests.post(
                      f"{base_url}/webasseturls",
                      json={"photoGuids": photo_guids},
                      headers=headers,
                      timeout=30
                  )
                  assets_resp.raise_for_status()
                  assets_data = assets_resp.json()
                  items = assets_data.get("items", {})
                  locations = assets_data.get("locations", {})
                  for guid in photo_guids:
                      best_url = None
                      best_w = -1
                      for _, info in items.items():
                          if info.get("photoGuid") == guid or info.get("checksum") in str(assets_data):
                              w = int(info.get("width") or 0)
                              url_loc = info.get("url_location")
                              path = info.get("url_path")
                              if url_loc and path and w >= best_w:
                                  loc_obj = locations.get(url_loc, {})
                                  scheme = loc_obj.get("scheme", "https")
                                  hosts = loc_obj.get("hosts", [])
                                  if hosts:
                                      best_w = w
                                      best_url = f"{scheme}://{hosts[0]}{path}"
                      if best_url:
                          photos.append(best_url)

          with open("public/photos.json", "w") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "photos": photos[:200]}, f)
          print(f"Fetched {len(photos[:200])} photos from iCloud album.")
          EOF

      - name: Write version timestamp
        run: date -u +"%Y%m%dT%H%M%SZ" > public/version.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
