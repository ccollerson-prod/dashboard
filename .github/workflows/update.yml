name: Update Family Dashboard
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Private Calendar, BBC News & Google Photos
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          PHOTOS_URL: ${{ secrets.PHOTOS_URL }}
        run: |
          mkdir -p public
          cp index.html public/index.html
          date -u +"%Y-%m-%dT%H:%M:%SZ" > public/version.txt
          python3 - << 'EOF'
          import os, urllib.request, json, re, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          # 1. Fetch Private Calendar
          url = os.environ.get("ICAL_URL", "").strip()
          events = []
          if url:
              raw = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", errors="ignore")
              raw = re.sub(r"\r?\n[ \t]", "", raw)
              for block in raw.split("BEGIN:VEVENT")[1:]:
                  block = block.split("END:VEVENT")[0]
                  summary = re.search(r"^SUMMARY(?:;[^:]*)?:(.*)$", block, re.M)
                  dtstart = re.search(r"^DTSTART(?:;[^:]*)?:(.*)$", block, re.M)
                  if summary and dtstart:
                      events.append({
                          "title": summary.group(1).replace("\\,", ",").strip(),
                          "start": dtstart.group(1).strip()
                      })
          with open("public/events.json", "w") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "events": events}, f)

          # 2. Fetch BBC News UK Headlines
          headlines = []
          try:
              req = urllib.request.Request("https://feeds.bbci.co.uk/news/uk/rss.xml", headers={"User-Agent": "Mozilla/5.0"})
              xml_data = urllib.request.urlopen(req, timeout=20).read()
              root = ET.fromstring(xml_data)
              for item in root.findall(".//item")[:8]:
                  title_el = item.find("title")
                  if title_el is not None and title_el.text:
                      headlines.append(title_el.text.strip())
          except Exception:
              headlines = ["Unable to load BBC News headlines right now."]
          with open("public/news.json", "w") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "headlines": headlines}, f)

          # 3. Fetch Google Photos Shared Album URLs
          photos_url = os.environ.get("PHOTOS_URL", "").strip()
          photos = []
          if photos_url:
              try:
                  req = urllib.request.Request(
                      photos_url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                          "Accept-Language": "en-GB,en;q=0.9"
                      }
                  )
                  html = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", errors="ignore")
                  html = html.replace("\\u003d", "=").replace("\\/", "/")
                  matches = re.findall(r'https://lh3\.googleusercontent\.com/[A-Za-z0-9_\-/]+', html)
                  seen = set()
                  for m in matches:
                      if "/a/" in m or "/a-/" in m or len(m) < 65:
                          continue
                      base = m.split("=")[0]
                      if base not in seen:
                          seen.add(base)
                          photos.append(base + "=w1200-h800-no")
              except Exception as e:
                  print("Photo fetch error:", e)
          print(f"Fetched {len(photos)} photos from album")
          with open("public/photos.json", "w") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "photos": photos[:40]}, f)
          EOF

      - name: Package Pages Artifact
        run: |
          mkdir -p _artifact
          tar --dereference --hard-dereference -cvf _artifact/artifact.tar -C public .

      - name: Upload Pages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _artifact/artifact.tar
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
